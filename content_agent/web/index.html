<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — TikTok Content Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/img/argent.png">
<script>
  // Thème appliqué avant l'affichage (évite le flash)
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">▶</span><div><b>Studio</b><small>TikTok Content Agent</small></div></div>

    <div class="side-label">Mes comptes</div>
    <nav id="accountNav" class="account-nav"></nav>

    <div class="side-label">Menu</div>
    <nav id="mainNav" class="main-nav"></nav>

    <div class="side-bottom">
      <div id="taskMini" class="task-mini hidden"></div>
      <div class="free-badge"><span class="dot-ok"></span>0 € de frais en plus</div>
      <button class="theme-btn" id="themeBtn" title="Changer de thème"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle"></div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="newPlanBtn"></button>
      </div>
    </header>
    <div id="alertBar" class="alert-bar hidden"></div>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="sheet" class="sheet hidden"><div class="sheet-backdrop" data-close></div><div class="sheet-panel" id="sheetPanel"></div></div>
<div id="dialog" class="dialog hidden"><div class="sheet-backdrop" data-close></div><div class="dialog-panel" id="dialogPanel"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
