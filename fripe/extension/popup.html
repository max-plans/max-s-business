<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fripe Connect</title>
<style>
  body { margin: 0; width: 280px; background: #0c0c0f; color: #f3f0ea; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { padding: 16px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 16px; letter-spacing: .02em; } h1 i { font-style: normal; color: #ff2e4d; }
  ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: rgba(243,240,234,.8); }
  a { display: block; text-align: center; background: #ff2e4d; color: #0b0b0e; border-radius: 8px; padding: 9px; font-weight: 700; text-decoration: none; }
  small { color: rgba(243,240,234,.5); }
</style>
</head>
<body>
<div class="wrap">
  <h1>FRIPE<i>·</i>CONNECT</h1>
  <ol>
    <li>Dans Fripe, ouvre <b>Mes articles</b>.</li>
    <li>Clique sur <b>Publier sur Vinted</b> à côté d’un article.</li>
    <li>Vinted s’ouvre avec l’annonce pré-remplie : vérifie, puis clique sur <b>Ajouter</b>.</li>
  </ol>
  <a href="https://fripe-iota.vercel.app/#stock" target="_blank" rel="noopener">Ouvrir Fripe</a>
  <small>Fripe n’est pas affilié à Vinted. Rien n’est publié sans ton clic.</small>
</div>
