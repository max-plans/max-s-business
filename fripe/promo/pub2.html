<style>

<script src="gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
const DUR = 32;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (cls, html, parent = $('#fx')) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html || ''; parent.appendChild(d); return d; };
let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); // hasard reproductible : chaque rendu est identique
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
const show = (sel, from, to) => { tl.set(sel, { visibility: 'visible' }, from); if (to !== undefined) tl.set(sel, { visibility: 'hidden' }, to); };

/* vêtements dessinés (viewBox 100×100) */
const CL = {
  tee: (c) => `<svg viewBox="0 0 100 100"><path d="M32 14l11-5c2 6 12 6 14 0l11 5 20 17-11 13-8-6v50H31V38l-8 6-11-13z" fill="${c}"/><path d="M43 9c2 6 12 6 14 0" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="3"/></svg>`,
  hoodie: (c) => `<svg viewBox="0 0 100 100"><path d="M36 16c2-8 26-8 28 0l20 14 6 40-12 2-4-28v50H26V44l-4 28-12-2 6-40z" fill="${c}"/><path d="M38 17c4 10 20 10 24 0" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="4"/><rect x="38" y="58" width="24" height="14" rx="4" fill="rgba(0,0,0,.18)"/></svg>`,
  sneaker: (c) => `<svg viewBox="0 0 100 100"><path d="M6 64l6-26c10 4 22 2 28-6l12 12c12 6 28 8 40 12 5 2 6 8 4 12H6z" fill="${c}"/><rect x="4" y="68" width="92" height="10" rx="5" fill="#f3f0ea"/><path d="M30 44l6 8M38 40l6 8M46 44l6 6" stroke="rgba(0,0,0,.3)" stroke-width="3"/></svg>`,
  bag: (c) => `<svg viewBox="0 0 100 100"><path d="M34 34c0-22 32-22 32 0" fill="none" stroke="${c}" stroke-width="7"/><path d="M18 34h64l6 54H12z" fill="${c}"/><rect x="40" y="48" width="20" height="8" rx="3" fill="rgba(255,255,255,.4)"/></svg>`,
  cap: (c) => `<svg viewBox="0 0 100 100"><path d="M14 64c0-28 16-40 36-40s36 12 36 40z" fill="${c}"/><path d="M50 64h44c2 8-6 12-14 12H50z" fill="${c}" opacity=".8"/><circle cx="50" cy="26" r="4" fill="rgba(0,0,0,.3)"/></svg>`,
  jean: (c) => `<svg viewBox="0 0 100 100"><path d="M28 8h44l6 86H56l-6-56-6 56H22z" fill="${c}"/><path d="M28 18h44" stroke="rgba(0,0,0,.25)" stroke-width="3"/></svg>`,
};
const PAL = ['#c88a45', '#3e6fb8', '#e8e3d8', '#ff2e4d', '#2c6b45', '#7a4bd1', '#ff7a1a', '#1f1f26', '#5aa9e6'];
const ICONS = Object.keys(CL);
const tag = `<svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="7.5" cy="8.5" r="1.6" fill="#fff"/></svg>`;
const boxI = `<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
const home = `<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
const euro = `<svg viewBox="0 0 24 24"><path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>`;

/* pièces qui jaillissent d'un point */
function coins(x, y, at, n = 10, spread = 520) {
  for (let i = 0; i < n; i++) {
    const c = el('coin', '€'), a = rnd() * Math.PI * 2, d = spread * (.4 + rnd() * .6);
    gsap.set(c, { x, y, scale: 0 });
    tl.to(c, { scale: .7 + rnd() * .6, duration: .15 }, at)
      .to(c, { x: x + Math.cos(a) * d, duration: 1.3, ease: 'power2.out' }, at)
      .to(c, { y: y + Math.sin(a) * d * .6 - 260, duration: .5, ease: 'power2.out' }, at)
      .to(c, { y: '+=900', duration: .8, ease: 'power2.in' }, at + .5)
      .to(c, { rotationY: 720 + rnd() * 360, rotation: rnd() * 90 - 45, duration: 1.3, ease: 'none' }, at)
      .to(c, { opacity: 0, duration: .25 }, at + 1.05);
  }
}
function pluses(items, at) {
  items.forEach(([txt, x, y], i) => {
    const p = el('plus', txt); gsap.set(p, { x: 540, y: 960, scale: 0, opacity: 1 });
    tl.to(p, { x, y, scale: 1, duration: .6, ease: 'back.out(1.8)' }, at + i * .35)
      .to(p, { y: y - 120, opacity: 0, duration: .6, ease: 'power2.in' }, at + i * .35 + 1.4);
  });
}

/* ---------- A. accroche 0 → 3 s : le téléphone tombe, les ventes pleuvent ---------- */
const marq = $('#marq'); marq.textContent = 'Vendu · Vendu · Vendu · Vendu · Vendu · ';
show('#marq', 0, 3); show('#world', 0, 3.05); tl.set('#lock', { visibility: 'visible' }, 0).set('#lock', { visibility: 'hidden' }, 3.05);
tl.fromTo('#marq', { x: 0 }, { x: -1800, duration: 3, ease: 'none' }, 0);
tl.fromTo('#phone', { y: -1500, rotation: -14, rotationX: 0, scale: 1 }, { y: 0, rotation: 0, duration: .55, ease: 'back.out(1.1)' }, 0);
const NOT = [['Veste Carhartt', '+38 €'], ['Air Force 1', '+43 €'], ['Sac Longchamp', '+36 €'], ['Lot Pokémon', '+37 €']];
const notifs = NOT.map(([t, p]) => el('notif', `<div class="ic"><svg viewBox="-2 -2 52 52"><use href="#logo"/></svg></div><div><b>Vendu !</b><span>${t}</span></div><em>${p}</em>`, $('#lock')));
notifs.forEach((n, i) => {
  const at = .55 + i * .5;
  tl.fromTo(n, { y: -200, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: .3, ease: 'back.out(2)' }, at);
  notifs.slice(0, i).forEach((p, j) => tl.to(p, { y: (i - j) * 142, duration: .3 }, at));
  coins(540, 760, at + .05, 7, 560);
});
tl.to('#phone', { scale: 1.05, duration: .12, yoyo: true, repeat: 7, ease: 'sine.inOut' }, .55);
tl.to('#phone', { scale: 3.4, y: 300, duration: .45, ease: 'power3.in' }, 2.6);
tl.fromTo('#flash', { opacity: 0 }, { opacity: 1, duration: .1, ease: 'none' }, 2.92).to('#flash', { opacity: 0, duration: .35 }, 3.02);

/* ---------- B. le bazar 3 → 6 s : les vêtements pleuvent et s'entassent ---------- */
show('#mess', 3, 6.05);
const pile = [];
for (let i = 0; i < 16; i++) {
  const k = ICONS[i % ICONS.length], c = el('cloth', CL[k](PAL[(i * 4) % PAL.length]), $('#mess'));
  const x = 120 + rnd() * 840, y = 1150 + rnd() * 600, r = rnd() * 80 - 40, s = .8 + rnd() * .7;
  gsap.set(c, { x, y: -300, rotation: r * 3, scale: s });
  tl.to(c, { y, rotation: r, duration: .5, ease: 'bounce.out' }, 3 + i * .1);
  pile.push(c);
}
['???', '24 € ?', '?'].forEach((t, i) => {
  const s = el('sticky', t, $('#mess')); s.style.fontSize = t.length > 2 ? '56px' : '92px';
  gsap.set(s, { x: [230, 830, 520][i], y: [420, 520, 330][i], rotation: [-12, 9, -4][i] });
  tl.from(s, { scale: 0, rotation: 60, duration: .35, ease: 'back.out(2)' }, 3.6 + i * .25);
  pile.push(s);
});
show('#bazar', 4, 6.05);
tl.from('#bazar', { scale: 3.2, opacity: 0, rotation: -8, duration: .3, ease: 'power4.in' }, 4)
  .to('#bazar', { rotation: -4, duration: .01 }, 4.3)
  .to('#mess', { x: 12, duration: .05, repeat: 9, yoyo: true, ease: 'none' }, 4.3)
  .to('#stage', { x: 8, duration: .04, repeat: 5, yoyo: true, ease: 'none' }, 4.3)
  .set('#stage', { x: 0 }, 4.6);
tl.to(pile, { x: 540, y: 960, scale: 0, rotation: '+=360', duration: .55, ease: 'power3.in', stagger: .015 }, 5.35)
  .to('#bazar', { scale: 0, opacity: 0, duration: .45, ease: 'power3.in' }, 5.45);

/* ---------- C. logo 6 → 8 s : onde de choc ---------- */
show('#intro', 6, 8.05);
tl.fromTo('#flash', { opacity: 0 }, { opacity: .85, duration: .06, ease: 'none' }, 5.95).to('#flash', { opacity: 0, duration: .4 }, 6.01);
$$('#intro .ring').forEach((r, i) => tl.fromTo(r, { scale: .2, opacity: 1 }, { scale: 6, opacity: 0, duration: 1.1, ease: 'expo.out' }, 6 + i * .12));
tl.fromTo('#rays', { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 40, duration: 2, ease: 'none' }, 6).to('#rays', { opacity: 0, duration: .3 }, 7.8);
tl.from('#intro .logo', { scale: 0, rotation: -200, duration: .9, ease: 'back.out(1.6)' }, 6)
  .from('#wm', { yPercent: 80, opacity: 0, letterSpacing: '.5em', duration: .7, ease: 'expo.out' }, 6.5)
  .to(['#intro .logo', '#wm'], { scale: .85, opacity: 0, duration: .3, ease: 'power3.in' }, 7.75);

/* ---------- D. les fonctions 8 → 24 s : le téléphone en 3D ---------- */
show('#world', 8, 23.9);
const SCR = ['#dash', '#stock', '#item', '#chat'];
const screen = (s, at) => SCR.forEach((x) => tl.set(x, { visibility: x === s ? 'visible' : 'hidden' }, at));
const flip = (s, at) => { tl.to('#phone', { rotationY: 90, duration: .22, ease: 'power2.in' }, at); screen(s, at + .22); tl.fromTo('#phone', { rotationY: -90 }, { rotationY: 0, duration: .35, ease: 'back.out(1.4)', immediateRender: false }, at + .22); };
screen('#dash', 8);
tl.fromTo('#phone', { y: 1400, x: 0, scale: .9, rotationX: 55, rotationY: 0, rotation: 0 }, { y: 120, rotationX: 0, scale: .92, duration: .7, ease: 'expo.out', immediateRender: false }, 8);
tl.to('#phone', { rotationY: -14, rotationX: 6, duration: 3, ease: 'sine.inOut' }, 8.7);
const capIn = (c, from, to) => { show(c, from, to); tl.from(c, { scale: 2.2, opacity: 0, duration: .35, ease: 'power4.out' }, from).to(c, { opacity: 0, y: -40, duration: .25 }, to - .25); };

/* D1 bénéfice */
capIn('#c1', 8.15, 12);
const dn = { v: 0 }; tl.to(dn, { v: 1248, duration: 1.8, ease: 'power2.out' }, 8.6);
tl.from('#dash .bars i', { scaleY: 0, duration: .5, stagger: .1, ease: 'back.out(1.6)' }, 8.7)
  .from('#dash .chips span', { y: 60, opacity: 0, duration: .35, stagger: .12, ease: 'back.out(2)' }, 9.6);
pluses([['+38 €', 190, 820], ['+43 €', 900, 700], ['+36 €', 170, 1300], ['+37 €', 910, 1200]], 9.4);
coins(540, 1000, 10.6, 12, 650);

/* D2 stock : les vêtements volent dans le téléphone */
flip('#stock', 11.85);
capIn('#c2', 12.1, 16);
tl.to('#phone', { rotationY: 12, rotationX: 4, duration: 3.3, ease: 'sine.inOut' }, 12.4);
const rows = $('#rows');
[['jean', '#3e6fb8'], ['sneaker', '#e8e3d8'], ['hoodie', '#ff7a1a'], ['bag', '#2c6b45'], ['cap', '#7a4bd1']].forEach(([k, col], i) => {
  const r = el('srow', `<div class="th" style="background:#22222a">${CL[k](col)}</div><div class="ln"><i></i><i></i></div><div class="pl">${i === 1 ? 'en ligne' : 'stock'}</div>`, rows);
  const f = el('cloth', CL[k](col)); const side = i % 2 ? 1 : -1;
  gsap.set(f, { x: 540 + side * 620, y: 700 + i * 170, scale: 1.1, rotation: side * 40, opacity: 0 });
  tl.set(f, { opacity: 1 }, 12.3);
  tl.to(f, { x: 410, y: 690 + i * 144, scale: .4, rotation: 0, duration: .55, ease: 'power3.in' }, 12.4 + i * .28)
    .set(f, { opacity: 0 }, 12.95 + i * .28)
    .from(r, { scale: .6, opacity: 0, duration: .3, ease: 'back.out(2)' }, 12.9 + i * .28);
});
const sold = () => $$('#rows .pl')[1];
coins(540, 830, 14.7, 9, 520);
tl.to('#rows .srow:nth-child(2)', { scale: 1.06, boxShadow: '0 0 0 4px #ff2e4d', duration: .2 }, 14.6).to('#rows .srow:nth-child(2)', { scale: 1, duration: .3 }, 15.1);

/* D3 publier : clic, la fiche s'envole vers l'annonce Vinted */
$('#iphoto').innerHTML = CL.hoodie('#c88a45'); $('#flycard').innerHTML = CL.hoodie('#e2b27a');
flip('#item', 15.85);
capIn('#c3', 16.1, 20);
tl.to('#phone', { x: -240, rotationY: 18, rotationX: 0, scale: .82, duration: .7, ease: 'power3.inOut' }, 16.3);
const rip = el('ripple'); gsap.set(rip, { x: 330, y: 1300 });
tl.to('#item .btn', { scale: .93, duration: .1, yoyo: true, repeat: 1 }, 17.1)
  .fromTo(rip, { scale: .2, opacity: 1 }, { scale: 2, opacity: 0, duration: .5, immediateRender: false }, 17.15);
show('#flycard', 17.25, 18.4); show('#browser', 17.3, 20);
tl.fromTo('#flycard', { x: 300, y: 820, scale: .6, rotation: 0 }, { keyframes: [{ x: 560, y: 520, scale: 1, rotation: 12, duration: .45, ease: 'power2.out' }, { x: 795, y: 1030, scale: .45, rotation: 0, duration: .5, ease: 'power2.in' }] }, 17.25)
  .to('#flycard', { opacity: 0, duration: .15 }, 18.2)
  .fromTo('#browser', { x: 700, rotation: 8 }, { x: 0, rotation: 0, duration: .55, ease: 'expo.out' }, 17.3)
  .from('#browser .ph i', { scale: 0, duration: .25, stagger: .08, ease: 'back.out(2)' }, 18.2)
  .from('#browser .f u', { scaleX: 0, duration: .35, stagger: .2 }, 18.4)
  .from('#browser .f b', { scale: 0, duration: .25, stagger: .2, ease: 'back.out(3)' }, 18.3)
  .to('#browser', { x: 800, duration: .4, ease: 'power3.in' }, 19.6);

/* D4 messages et colis */
flip('#chat', 19.85);
capIn('#c4', 20.1, 23.9);
tl.to('#phone', { x: 0, y: -60, scale: .78, duration: .6, ease: 'power3.inOut' }, 20).to('#phone', { rotationY: -10, duration: 1.5, ease: 'sine.inOut' }, 20.45);
tl.from('#chat .b', { scale: 0, duration: .3, stagger: .25, ease: 'back.out(2)', transformOrigin: (i) => (i % 2 ? '100% 100%' : '0% 100%') }, 20.4);
[['#22222a', 70, 640, 330], ['linear-gradient(100deg,#ff7a1a,#ff2e4d)', 690, 760, 330], ['#22222a', 60, 1180, 280]].forEach(([bg, x, y, w], i) => {
  const b = el('bub', '<i></i><i></i>'); b.style.background = bg; b.style.width = w + 'px';
  gsap.set(b, { x, y, scale: 0 });
  tl.to(b, { scale: 1, duration: .35, ease: 'back.out(2)' }, 20.6 + i * .35).to(b, { y: y - 60, opacity: 0, duration: .4 }, 22 + i * .1);
});
show('#road', 21.6, 23.9);
$('#box').innerHTML = `<svg viewBox="0 0 100 90"><path d="M50 5l45 20v45L50 88 5 70V25z" fill="#c8894a"/><path d="M5 25l45 20 45-20M50 45v43" fill="none" stroke="#8d5a28" stroke-width="4"/><path d="M27 15l45 20v14" fill="none" stroke="#f3e2c4" stroke-width="7"/></svg>`;
const CPX = [60, 360, 660, 840];
[tag, boxI, home, euro].forEach((svg, i) => { const c = el('cp', svg, $('#road')); c.style.left = (CPX[i] + 30) + 'px'; });
tl.from('#road', { y: 200, opacity: 0, duration: .4 }, 21.6)
  .fromTo('#road .path i', { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: 'none' }, 22)
  .fromTo('#box', { x: 90 }, { x: 870, duration: 1.5, ease: 'none' }, 22)
  .to('#box', { y: -70, duration: .19, yoyo: true, repeat: 7, ease: 'sine.out' }, 22);
$$('#road .cp').forEach((c, i) => tl.set(c, { className: 'cp on' }, 22 + i * .48).from(c, { scale: .6, duration: .3, ease: 'back.out(3)' }, 22 + i * .48));
coins(930, 1640, 23.45, 10, 500);
tl.to('#phone', { scale: 4, y: 400, opacity: 0, duration: .45, ease: 'power3.in' }, 23.45);

/* ---------- E. slogan 24 → 28 s : un mot, une couleur ---------- */
show('#slog', 24, 28);
const W = $$('#slog .w'), BG = ['#ff2e4d', '#f3f0ea', '#060607'];
W.forEach((w, i) => {
  tl.set('#bgc', { background: BG[i] }, 24 + i).set(W, { visibility: 'hidden' }, 24 + i).set(w, { visibility: 'visible' }, 24 + i)
    .fromTo(w, { scale: 2.4, filter: 'blur(14px)' }, { scale: 1, filter: 'blur(0px)', duration: .35, ease: 'expo.out' }, 24 + i)
    .to(w, { scale: 1.08, duration: .6, ease: 'none' }, 24.35 + i);
});
tl.set('#glow', { opacity: 0 }, 24).set('#glow', { opacity: 1 }, 26);
coins(540, 980, 26.1, 16, 760);
tl.to(W[2], { scale: .4, opacity: 0, duration: .45, ease: 'power3.in' }, 27.5).set(W, { visibility: 'hidden' }, 28);

/* ---------- F. fin 28 → 32 s ---------- */
show('#end', 28);
tl.from('#end .logo', { scale: 0, rotation: -120, duration: .7, ease: 'back.out(1.8)' }, 28)
  .from('#end .free', { scale: 2.5, opacity: 0, duration: .45, ease: 'power4.out' }, 28.3)
  .from('#end .sub', { opacity: 0, y: 30, duration: .4 }, 28.7)
  .from('#end .url', { scale: .5, opacity: 0, duration: .5, ease: 'back.out(2)' }, 29)
  .to('#end .url', { scale: 1.05, duration: .25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 29.8)
  .from('#end .disc', { opacity: 0, duration: .4 }, 29.4);
for (let i = 0; i < 14; i++) {
  const c = el('coin', '€'); gsap.set(c, { x: 60 + rnd() * 960, y: -120, scale: .5 + rnd() * .5, opacity: .55 });
  tl.to(c, { y: 2100, rotationY: 720, duration: 2.6 + rnd(), ease: 'none' }, 28.3 + rnd() * 2);
}
tl.to('#stage', { opacity: 0, duration: .5, ease: 'power1.in' }, 31.5);

/* textes calculés à chaque image */
function texts(t) {
  $('#dnum').textContent = '+' + Math.round(dn.v).toLocaleString('fr-FR').replace(/ | /g, ' ') + ' €';
  const p = sold(); const on = t >= 14.6; p.textContent = on ? 'vendu' : 'en ligne'; p.className = 'pl' + (on ? ' sold' : '');
}
$$('.cap').forEach((c) => { let fs = 140; c.style.fontSize = fs + 'px'; while (c.scrollWidth > c.clientWidth && fs > 60) { fs -= 4; c.style.fontSize = fs + 'px'; } });
$$('#slog .w').forEach((w) => { let fs = 330; const sp = $('span', w); sp.style.display = 'inline-block'; while (sp.offsetWidth > 1000 && fs > 100) { fs -= 6; w.style.fontSize = fs + 'px'; } });
window.DUR = DUR;
window.seek = (t) => { tl.seek(t, true); texts(t); };
window.seek(0);
window.ready = true;
});
</script>
</body>
</html>
