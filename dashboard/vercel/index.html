<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QG">
<title>Le QG de Max</title>
<style>
html,body{margin:0;height:100%;background:#0B0D12;color:#F4F2EE;font:16px system-ui,-apple-system,sans-serif}
.box{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center}
.logo{width:72px;height:72px;border-radius:18px;background:#FF5A1F;display:grid;place-items:center;font:italic 900 38px/1 system-ui,sans-serif;color:#fff;transform:skewX(-8deg);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:skewX(-8deg) scale(1.08)}}
p{margin:0;max-width:30ch;color:#8E95A6}
button{font:inherit;font-weight:700;color:#fff;background:#FF5A1F;border:0;border-radius:12px;padding:12px 22px}
small{color:#596073;font-size:12px;max-width:34ch;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box" id="box"><div class="logo">M</div><p id="msg">Chargement du QG…</p></div>
<script>
// Lanceur : affiche tout de suite la dernière version enregistrée du QG, puis récupère la nouvelle en arrière-plan.
(function () {
  var KEY = "qg-app-html";
  var REPO = "max-plans/max-s-business", BRANCH = "claude/daily-dashboard", PATH = "dashboard/site/index.html";
  var SOURCES = ["/app.html", "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + PATH];
  function fail(detail) {
    document.getElementById("box").innerHTML = '<div class="logo" style="animation:none">M</div><p>Impossible de charger le QG. Vérifie ta connexion puis réessaie.</p><button onclick="location.reload()">Réessayer</button><small>' + detail + '</small>';
  }
  function get(url) {
    var ctl = "AbortController" in window ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 12000);
    return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (h) { if (h.indexOf("Le QG de Max") < 0) throw new Error("page inattendue"); return h; });
  }
  function fetchFresh(i, errs) {
    if (i >= SOURCES.length) return Promise.reject(errs.join(" · "));
    return get(SOURCES[i]).catch(function (e) { errs.push((i === 0 ? "site" : "github") + " : " + (e && e.message || e)); return fetchFresh(i + 1, errs); });
  }
  function show(html) {
    var o = location.origin;
    var app = '<link rel="manifest" href="' + o + '/manifest.webmanifest"><link rel="apple-touch-icon" href="' + o + '/apple-touch-icon.png"><meta name="theme-color" content="#0B0D12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="QG"><link rel="icon" type="image/png" href="' + o + '/icon-192.png">';
    html = html.replace(/<link rel="icon"[^>]*>/, "").replace("<head>", "<head>" + app);
    document.open(); document.write(html); document.close();
  }
  var cached = null;
  try { cached = localStorage.getItem(KEY); } catch (e) {}
  var fresh = fetchFresh(0, []).then(function (h) { try { localStorage.setItem(KEY, h); } catch (e) {} return h; });
  // n'affiche la copie gardée que si elle sait se mettre à jour toute seule (sinon on attend la nouvelle version)
  if (cached && cached.indexOf("qg-updater-v1") >= 0) { show(cached); return; }
  fresh.then(show, fail);
})();
</script>
</body>
</html>
