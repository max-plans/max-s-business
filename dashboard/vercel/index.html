<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QG">
<title>Le QG de Max</title>
<style>html,body{margin:0;height:100%;background:#0B0D12;color:#FF8A4C;font:15px system-ui,sans-serif}p{padding:24px}</style>
</head>
<body>
<script>
// Lanceur : charge la dernière version du QG depuis la branche GitHub (via le CDN jsDelivr).
(async () => {
  const REPO = "max-plans/max-s-business", BRANCH = "claude/daily-dashboard", PINNED = "c905b976e93f9b192a6d2e340868fb6cdebf1a66";
  let sha = PINNED;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/${encodeURIComponent(BRANCH)}`, {headers:{Accept:"application/vnd.github.sha"}});
    if (r.ok) { const t = (await r.text()).trim(); if (/^[0-9a-f]{40}$/.test(t)) sha = t; }
  } catch {}
  const base = `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/dashboard/site/`;
  try {
    const r = await fetch(base + "index.html");
    if (!r.ok) throw new Error(r.status);
    const o = location.origin;
    const app = `<link rel="manifest" href="${o}/manifest.webmanifest"><link rel="apple-touch-icon" href="${o}/apple-touch-icon.png"><meta name="theme-color" content="#0B0D12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="QG">`;
    const html = (await r.text()).replace(/<link rel="icon"[^>]*>/, "").replace("<head>", `<head><base href="${base}">${app}<link rel="icon" type="image/png" href="${o}/icon-192.png">`);
    document.open(); document.write(html); document.close();
  } catch {
    document.body.innerHTML = "<p>Impossible de charger le QG. Vérifie ta connexion puis recharge la page.</p>";
  }
})();
</script>
</body>
</html>
