name: Vidéos TikTok quotidiennes

on:
  schedule:
    # Heures en UTC (Paris = UTC+2 l'été, UTC+1 l'hiver). 2 passages = 2 vidéos/jour/compte.
    - cron: "40 8 * * *"    # ≈ 10h40 à Paris → prête pour le créneau de midi
    - cron: "40 15 * * *"   # ≈ 17h40 à Paris → prête pour le créneau du soir
  workflow_dispatch:
    inputs:
      channels:
        description: "Comptes (vide = tous) : mindset stoic finance"
        required: false
        default: ""
      count:
        description: "Vidéos par compte"
        required: false
        default: "1"
      topic:
        description: "Sujet imposé (optionnel)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tiktok-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg et les polices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Générer et envoyer les vidéos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_MINDSET: ${{ secrets.TIKTOK_REFRESH_TOKEN_MINDSET }}
          TIKTOK_REFRESH_TOKEN_STOIC: ${{ secrets.TIKTOK_REFRESH_TOKEN_STOIC }}
          TIKTOK_REFRESH_TOKEN_FINANCE: ${{ secrets.TIKTOK_REFRESH_TOKEN_FINANCE }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
          CHANNELS: ${{ github.event.inputs.channels }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python -m tiktok_factory $CHANNELS --count "$COUNT" ${TOPIC:+--topic "$TOPIC"}

      - name: Sauvegarder les vidéos (téléchargeables 7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Mémoriser les sujets déjà traités
        if: always()
        run: |
          git config user.name "tiktok-factory-bot"
          git config user.email "tiktok-factory-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || (git commit -m "Historique des vidéos du $(date +%F)" && git push)
